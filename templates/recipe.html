<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/recipe.css') }}">
    <script defer src="{{ url_for('static', filename='js/recipe.js') }}"></script>
</head>

<body>
    <header class="header">
        <div class="logo">Recipe Extractor</div>
    </header>

    <main class="recipe-main">
        <a href="/" class="back-button">← 다시 추출하기</a>

        <section class="recipe-section">
            <div class="recipe-header">
                <div>
                    <div id="recipe-tags" class="recipe-tags"></div>
                    <h1 id="recipe-name"></h1>
                    <p class="servings" id="recipe-servings"></p>
                </div>

                <button class="save-button" type="button">
                    ♡ 저장
                </button>
            </div>

            <div class="recipe-card">
                <h2>재료</h2>
                <div class="ingredient-list" id="ingredient-list"></div>
            </div>

            <div class="recipe-card">
                <h2>조리 과정</h2>
                <ol class="steps" id="step-list"></ol>
            </div>

            <div class="recipe-card">
                <h2>대체 가능한 재료</h2>
                <div id="substitution-list" class="substitution-list">
                    <p class="empty-message">대체 가능한 재료 정보가 없습니다.</p>
                </div>
            </div>

            <div class="ai-chat">
                <h2>레시피 AI</h2>

                <p class="ai-description">
                    이 레시피에 대해 궁금한 점을 물어보세요.
                </p>

                <div id="chat-messages" class="chat-messages"></div>

                <div class="chat-box">
                    <input
                        type="text"
                        id="question"
                        placeholder="레시피에 대해 질문해보세요."
                    >
                    <button type="button" id="ask-button">↑</button>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
